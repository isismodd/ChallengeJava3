spring.application.name=ClyvoPet

server.port=${PORT:8082}

# ============================================================
# CONEXÃO COM O BANCO DE DADOS ORACLE
# ============================================================

spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:oracle.fiap.com.br}:${DB_PORT:1521}:${DB_SERVICE:orcl}
spring.datasource.username=${DB_USERNAME:rm561497}
spring.datasource.password=${DB_PASSWORD:030606}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA - DESATIVAR completamente a criação de schemas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false

# Flyway - Configuração FORTE
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.url=${spring.datasource.url}
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true

# Logs para ver o que está acontecendo
logging.level.org.flywaydb=DEBUG

# ============================================================
# THYMELEAF
# ============================================================

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ============================================================
# SPRING SECURITY
# ============================================================

spring.security.user.name=${SECURITY_USERNAME:admin}
spring.security.user.password=${SECURITY_PASSWORD:admin123}
spring.security.user.roles=USER

# ============================================================
# CONFIGURAÇÃO DE E-MAIL (SMTP)
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:isismacc@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:chev mshy wrog iyth}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.default-encoding=UTF-8